

name: Build ApnaBazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o tools.zip

          unzip -q tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          rm tools.zip

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Prepare Bubblewrap project
        run: |
          set -e

          mkdir -p twa "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          cat > twa/twa-manifest.json <<'EOF'
          {
            "packageId": "com.apnabazaar.app",
            "host": "apnabazaar-plwb.vercel.app",
            "name": "ApnaBazaar",
            "launcherName": "ApnaBazaar",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#16a34a",
            "themeColorDark": "#16a34a",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "backgroundColor": "#ffffff",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png",
            "maskableIconUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "apnabazaar"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://apnabazaar-plwb.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://apnabazaar-plwb.vercel.app/",
            "minSdkVersion": 21,
            "kotlinVersion": "1.9.22",
            "targetSdkVersion": 34
          }
          EOF

          keytool -genkeypair -v \
            -keystore twa/android.keystore \
            -alias apnabazaar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass apnabazaar123 \
            -keypass apnabazaar123 \
            -dname "CN=ApnaBazaar, OU=App, O=ApnaBazaar, L=India, S=India, C=IN"

      - name: Update Bubblewrap project
        run: |
          set -e
          cd twa

          yes "" | npx --yes @bubblewrap/cli update --skipVersionUpgrade

      - name: Build ApnaBazaar APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: apnabazaar123
          BUBBLEWRAP_KEY_PASSWORD: apnabazaar123
        run: |
          set -e
          cd twa

          npx --yes @bubblewrap/cli build --skipPwaValidation

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find twa -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApnaBazaar-APK
          path: |
            twa/*.apk
            twa/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
