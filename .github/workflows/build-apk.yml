

name: Build ApnaBazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o cmdline-tools.zip

          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          rm cmdline-tools.zip

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          python3 - << 'PYEOF'
          import json, os

          config = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": os.environ["ANDROID_SDK_ROOT"]
          }

          with open(os.path.expanduser("~/.bubblewrap/config.json"), "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

      - name: Prepare Bubblewrap TWA project
        run: |
          mkdir -p twa

          python3 - << 'PYEOF'
          import struct, zlib

          def make_png(filename, width, height, r, g, b):
              raw = bytearray()
              for _ in range(height):
                  raw.append(0)
                  for _ in range(width):
                      raw.extend((r, g, b, 255))

              def chunk(tag, data):
                  return (
                      struct.pack("!I", len(data))
                      + tag + data
                      + struct.pack("!I", zlib.crc32(tag + data) & 0xFFFFFFFF)
                  )

              ihdr = struct.pack("!IIBBBBB", width, height, 8, 6, 0, 0, 0)
              png = (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )

              with open(filename, "wb") as f:
                  f.write(png)

          make_png("twa/icon-512.png", 512, 512, 22, 163, 74)
          PYEOF

          cat << 'EOF' > twa/twa-manifest.json
          {
            "packageId": "com.apnabazaar.app",
            "host": "apnabazaar-plwb.vercel.app",
            "name": "ApnaBazaar",
            "launcherName": "ApnaBazaar",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#16a34a",
            "themeColorDark": "#16a34a",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#e5e7eb",
            "navigationDividerColorDark": "#1f2937",
            "backgroundColor": "#ffffff",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "./icon-512.png",
            "maskableIconUrl": "./icon-512.png",
            "monochromeIconUrl": "./icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "apnabazaar"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://apnabazaar-plwb.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://apnabazaar-plwb.vercel.app/",
            "minSdkVersion": 21,
            "kotlinVersion": "1.9.22",
            "targetSdkVersion": 34
          }
          EOF

          keytool -genkeypair -v \
            -keystore twa/android.keystore \
            -alias apnabazaar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass apnabazaar123 \
            -keypass apnabazaar123 \
            -dname "CN=ApnaBazaar, OU=App, O=ApnaBazaar, L=India, S=India, C=IN"

      - name: Generate Android project
        run: |
          cd twa
          npx --yes @bubblewrap/cli update --skipVersionUpgrade

      - name: Build Android APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: apnabazaar123
          BUBBLEWRAP_KEY_PASSWORD: apnabazaar123
        run: |
          cd twa
          npx --yes @bubblewrap/cli build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApnaBazaar-APK
          path: twa/**/*.apk
          if-no-files-found: error
          retention-days: 30
