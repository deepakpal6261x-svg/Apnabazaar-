
name: Build ApnaBazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & Build Tools
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Prepare Bubblewrap TWA project
        run: |
          mkdir -p twa "$HOME/.bubblewrap"
          cat << EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          cat << 'EOF' > twa/twa-manifest.json
          {
            "packageId": "com.apnabazaar.app",
            "host": "apnabazaar-plwb.vercel.app",
            "name": "ApnaBazaar",
            "launcherName": "ApnaBazaar",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#16a34a",
            "themeColorDark": "#16a34a",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#e5e7eb",
            "navigationDividerColorDark": "#1f2937",
            "backgroundColor": "#ffffff",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png",
            "maskableIconUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png",
            "monochromeIconUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "apnabazaar"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://apnabazaar-plwb.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://apnabazaar-plwb.vercel.app/",
            "minSdkVersion": 21,
            "kotlinVersion": "1.9.22",
            "targetSdkVersion": 34
          }
          EOF

          keytool -genkeypair -v \
            -keystore twa/android.keystore \
            -alias apnabazaar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass apnabazaar123 \
            -keypass apnabazaar123 \
            -dname "CN=ApnaBazaar, OU=App, O=ApnaBazaar, L=India, S=India, C=IN"

          cd twa
          (echo "n"; echo "$JAVA_HOME"; echo "$ANDROID_SDK_ROOT"; yes "apnabazaar123") | npx --yes @bubblewrap/cli update --skipPwaValidation || true

      - name: Build Android APK
        run: |
          cd twa
          (echo "n"; echo "$JAVA_HOME"; echo "$ANDROID_SDK_ROOT"; yes "apnabazaar123") | npx --yes @bubblewrap/cli build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApnaBazaar-APK
          path: |
            twa/app/build/outputs/apk/release/*.apk
            twa/app/build/outputs/apk/debug/*.apk
