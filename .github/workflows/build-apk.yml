name: Build ApnaBazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & Build Tools
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Initialize Bubblewrap TWA project
        run: |
          mkdir -p twa
          cd twa
          printf "n\n" | npx --yes @bubblewrap/cli init \
            --manifest https://apnabazaar-plwb.vercel.app/manifest.webmanifest \
            --packageName com.apnabazaar.app \
            --name "ApnaBazaar" \
            --launcherName "ApnaBazaar" \
            --displayMode standalone \
            --orientation portrait \
            --themeColor "#16a34a" \
            --backgroundColor "#ffffff" \
            --startUrl / \
            --iconUrl https://apnabazaar-plwb.vercel.app/icon-512.png \
            --maskableIconUrl https://apnabazaar-plwb.vercel.app/icon-512.png \
            --monochromeIconUrl https://apnabazaar-plwb.vercel.app/icon-512.png \
            --signingKeyPath ./android.keystore \
            --signingKeyAlias apnabazaar \
            --signingKeyPassword apnabazaar123 \
            --keyPassword apnabazaar123 \
            --appVersionName "1.0.0" \
            --appVersionCode 1

      - name: Build Android APK
        run: |
          cd twa
          printf "n\n" | npx --yes @bubblewrap/cli build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApnaBazaar-APK
          path: |
            twa/app/build/outputs/apk/release/*.apk
            twa/app/build/outputs/apk/debug/*.apk
